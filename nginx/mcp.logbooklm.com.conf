server {
    listen 80;
    server_name mcp.logbooklm.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mcp.logbooklm.com;

    # SSL — populated by certbot
    ssl_certificate     /etc/letsencrypt/live/mcp.logbooklm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.logbooklm.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy to MCP server (SSE transport)
    location / {
        proxy_pass         http://mcp:8765;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for SSE
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
